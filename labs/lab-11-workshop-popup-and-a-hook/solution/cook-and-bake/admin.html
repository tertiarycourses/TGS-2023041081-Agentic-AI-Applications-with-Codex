<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign-ups — Cook &amp; Bake staff</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A5%90%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: .9rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Sign-ups on this device</h1>
    <p class="muted">A static site has no server, so sign-ups are stored in this browser. Export them as CSV and upload the file to Drive — it is the input to Day 2's enrolment lab.</p>
    <p><button class="btn" id="export" type="button">Export CSV</button> <a href="index.html">Back to site</a></p>
    <div class="wrap"><table id="rows"></table></div>
  </main>
  <script type="module">
    const COLS = ['ref','submitted','course_code','course_title','intake','full_name','email','mobile','experience','allergies','marketing_opt_in','paid'];
    const rows = JSON.parse(localStorage.getItem('cb_signups') || '[]');
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
    document.querySelector('#rows').innerHTML =
      `<tr>${COLS.map(c => `<th>${c}</th>`).join('')}</tr>` +
      (rows.length ? rows.map(r => `<tr>${COLS.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')
                   : `<tr><td colspan="${COLS.length}">No sign-ups yet.</td></tr>`);
    const csvCell = v => /[",\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? '');
    document.querySelector('#export').addEventListener('click', () => {
      const csv = [COLS.join(','), ...rows.map(r => COLS.map(c => csvCell(r[c])).join(','))].join('\n');
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })),
        download: `signups-${new Date().toISOString().slice(0, 10)}.csv`,
      });
      a.click();
    });
  </script>
</body>
</html>
